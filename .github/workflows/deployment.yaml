name: deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      # 3. Check Terraform installation
      - name: Check Terraform
        run: terraform version

      # 4. Azure login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 5. Terraform Init
      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -upgrade

      # 6. Terraform Validate
      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      # 7. Terraform Plan
      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan

      # 8. Terraform Apply
      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve

      # 9. Setup .NET 8
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 10. Restore dependencies
      - name: Restore
        run: dotnet restore Flipkart-clone.csproj

      # 11. Publish application
      - name: Publish app
        run: dotnet publish Flipkart-clone.csproj -c Release -o ./publish

      # 12. Deploy application
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: flipkart-webapp-demo
          package: ./publish