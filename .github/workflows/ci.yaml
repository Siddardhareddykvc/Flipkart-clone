name: flipkart-clone
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up dotnet
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      - name: restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
